<body><div id="app"><div class="loading">WAKEFIELD <span>Setting up the table…</span></div></div><div id="modal-root"></div><div id="toast" role="status" aria-live="polite"></div><script type="module">const uid = () => globalThis.crypto.randomUUID?.() || Array.from(globalThis.crypto.getRandomValues(new Uint8Array(16)), n => n.toString(16).padStart(2, '0')).join('');
const defaults = { name: 'Wakefield Pool Club', season: 'The inaugural season', frames: 1, finalFrames: 1, winPoints: 3, divisionSize: 11, approval: true, consolation: true, rules: 'Seven-ball pool. Agree school rules before breaking.', logo: '' };
function initialState(demo = false) {
  const names = demo ? ['Mr French','George','Oliver W.','Harry S.','Jack B.','Charlie H.','Leo M.','Oscar T.','Arthur C.','Noah P.','Alfie R.','Freddie L.','Henry D.','Theo A.','Archie K.','Thomas G.','James E.','William N.','Edward F.','Joshua V.','Max I.','Samuel J.','Isaac O.','Lucas U.','Jacob Y.','Daniel Z.','Joseph W.','Toby S.','Finley B.','Ethan H.','Benjamin M.','Hugo T.','Alexander C.','Reuben P.','Sebastian R.','Louis L.','Rory D.','Jude A.','Felix K.','Albert G.','Adam E.','Luke N.'] : ['Mr French','George'];
  const state = { settings: { ...defaults }, players: names.map((name,i) => ({ id: demo ? `p${i}` : uid(), name, rating: 0 })), league: [], divisions: [], cups: [], submissions: [], activity: [] };
  if (demo) {
    createLeague(state);
    for (let i = 0; i < 18; i++) { const m = state.league[i]; m.status = 'complete'; m.score = i % 3 ? [1,0] : [0,1]; }
    createCup(state, 'The Wakefield Cup');
  }
  return state;
}
function shuffle(items) { const a = [...items]; for (let i=a.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function createLeague(s) {
  if (s.players.length < 2) throw Error('Add at least two players first.');
  if (s.league.some(m => m.status === 'complete') || s.submissions.some(x=>x.kind==='league')) throw Error('Archive this league before creating another.');
  const count = Math.ceil(s.players.length / s.settings.divisionSize);
  s.divisions = Array.from({length: count}, (_,i)=>({id:`d${i}`,name:`Division ${String.fromCharCode(65+i)}`,players:[]}));
  const order = shuffle(s.players).sort((a,b)=>b.rating-a.rating);
  order.forEach((p,i)=>{ const row=Math.floor(i/count); s.divisions[row%2 ? count-1-i%count : i%count].players.push(p.id); });
  s.league=[];
  for (const div of s.divisions) {
    const ring=[...div.players]; if (ring.length%2) ring.push(null);
    for(let round=1;round<ring.length;round++) {
      for(let i=0;i<ring.length/2;i++) if(ring[i] && ring[ring.length-1-i]) s.league.push({id:uid(),division:div.id,round,a:ring[i],b:ring[ring.length-1-i],status:'open',bestOf:s.settings.frames});
      ring.splice(1,0,ring.pop());
    }
  }
}
function standings(s, division) {
  const rows=s.players.filter(p=>!division || s.divisions.find(d=>d.id===division)?.players.includes(p.id)).map(p=>({...p,played:0,won:0,lost:0,for:0,against:0,points:0}));
  for(const m of s.league.filter(m=>m.status==='complete')) for(const [id,index] of [[m.a,0],[m.b,1]]) {
    const r=rows.find(r=>r.id===id); if(!r) continue;
    r.played++; r.for+=m.score[index];r.against+=m.score[1-index];
    if(m.score[index]>m.score[1-index]) {r.won++;r.points+=s.settings.winPoints;} else r.lost++;
  }
  return rows.sort((a,b)=>b.points-a.points || (b.for-b.against)-(a.for-a.against) || b.won-a.won || a.name.localeCompare(b.name));
}
function createCup(s,name,participants=s.players.map(p=>p.id), consolation=false) {
  if(participants.length<2) throw Error('A cup needs at least two players.');
  let size=2;while(size<participants.length)size*=2;
  const entrants=shuffle(participants), pairs=Array.from({length:size/2},()=>[null,null]);
  for(let i=0;i<size/2;i++)pairs[i][0]=entrants.shift();
  for(let i=0;entrants.length;i++)pairs[i][1]=entrants.shift();
  const cup={id:uid(),name,consolation,rounds:[]};
  for(let n=size/2;n>=1;n/=2)cup.rounds.push(Array.from({length:n},()=>({id:uid(),a:null,b:null,status:'waiting',bestOf:n===1?s.settings.finalFrames:s.settings.frames})));

  s.cups.push(cup); advanceCup(cup); return cup;

function advanceCup(cup) {
  for(let r=0;r<cup.rounds.length-1;r++) for(let i=0;i<cup.rounds[r].length;i+=2) {
    const x=cup.rounds[r][i], y=cup.rounds[r][i+1], target=cup.rounds[r+1][i/2];
    if(x.winner)target.a=x.winner;if(y.winner)target.b=y.winner;
    if(target.a && target.b && target.status==='waiting')target.status='open';
  }

function findMatch(s,id) { return s.league.find(m=>m.id===id) || s.cups.flatMap(c=>c.rounds.flat()).find(m=>m.id===id); }
function validateScore(match,score) {
  if(!match || match.status!=='open')throw Error('This match is no longer available.');
  const goal=Math.floor(match.bestOf/2)+1;
  if(!Array.isArray(score)||score.length!==2||!score.every(n=>Number.isInteger(n)&&n>=0&&n<=goal)||Math.max(...score)!==goal||Math.min(...score)>=goal)throw Error(`Enter a valid best-of-${match.bestOf} result.`);
}
function applyResult(s,id,score) {
  const m=findMatch(s,id); validateScore(m,score);m.score=score;m.status='complete';m.winner=score[0]>score[1]?m.a:m.b;

    advanceCup(c);

      c.consolationCreated=true; const losers=c.rounds[0].filter(m=>m.status==='complete').map(m=>m.winner===m.a?m.b:m.a);

    }
  }

function promote(s) {

  const ranking=s.divisions.map(d=>standings(s,d.id).map(p=>p.id));
  for(let i=0;i<ranking.length-1;i++) {const lowerWinner=ranking[i+1][0],upperLast=ranking[i].at(-1);ranking[i][ranking[i].length-1]=lowerWinner;ranking[i+1][0]=upperLast;}
  s.history??=[];s.history.push({season:s.settings.season,divisions:structuredClone(s.divisions),league:structuredClone(s.league)});
  ranking.flat().forEach((id,i)=>{s.players.find(p=>p.id===id).rating=ranking.flat().length-i;});
  // Preserve promoted division membership rather than rebalance it.
  s.league=[];s.submissions=s.submissions.filter(x=>x.kind!=='league');

function act(s,action,payload,user) {

  if(action==='submit') {

      if(action==='approve')applyResult(s,sub.match,sub.score);s.submissions=s.submissions.filter(x=>x.id!==sub.id);
    } else if(action==='settings') {
      const p=payload;
      for(const key of ['name','season','rules'])if(typeof p[key]==='string')s.settings[key]=p[key].trim().slice(0,300);
      for(const key of ['frames','finalFrames'])if(p[key]!==undefined) {if(![1,3,5,7,9].includes(+p[key]))throw Error('Choose an odd match length from 1 to 9.');s.settings[key]=+p[key];}
      if(p.winPoints!==undefined){if(!Number.isInteger(+p.winPoints)||+p.winPoints<1||+p.winPoints>10)throw Error('Win points must be 1–10.');s.settings.winPoints=+p.winPoints;}
      if(p.divisionSize!==undefined){if(!Number.isInteger(+p.divisionSize)||+p.divisionSize<3||+p.divisionSize>20)throw Error('Division size must be 3–20.');s.settings.divisionSize=+p.divisionSize;}
      for(const k of ['approval','consolation'])if(typeof p[k]==='boolean')s.settings[k]=p[k];
      if(typeof p.logo==='string') {if(p.logo.length>700000||!/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(p.logo))throw Error('Choose a PNG, JPEG or WebP logo under 500 KB.');s.settings.logo=p.logo;}
    } else if(action==='addPlayers') {
      if(s.league.length||s.cups.length)throw Error('Add players before generating competitions.');
      const names=String(payload.names||'').split('\n').map(x=>x.trim()).filter(Boolean);
      if(!names.length||s.players.length+names.length>64)throw Error('Enter names; the maximum is 64 players.');
      if(names.some(n=>n.length>45)||new Set([...s.players.map(p=>p.name.toLowerCase()),...names.map(n=>n.toLowerCase())]).size!==s.players.length+names.length)throw Error('Use unique display names of up to 45 characters.');
      names.forEach(name=>s.players.push({id:uid(),name,rating:0}));
    } else if(action==='player') {
      const p=s.players.find(p=>p.id===payload.id);if(!p)throw Error('Player not found.');
      const name=String(payload.name||'').trim();if(!name||name.length>45||s.players.some(x=>x.id!==p.id&&x.name.toLowerCase()===name.toLowerCase()))throw Error('Use a unique display name of up to 45 characters.');
      p.name=name; const rating=+payload.rating;if(!Number.isFinite(rating)||rating<0||rating>100)throw Error('Ability must be 0–100.');p.rating=rating;
    } else if(action==='league')createLeague(s);
    else if(action==='cup')createCup(s,String(payload.name||'The Wakefield Cup').trim().slice(0,70)||'The Wakefield Cup');
    else if(action==='promote')promote(s);
    else throw Error('Unknown action.');
  }
  s.activity.unshift({text:({submit:'Result submitted',approve:'Result approved',reject:'Result returned for correction',league:'League fixtures generated',cup:'Cup draw created',promote:'New league season started',settings:'Club settings updated',addPlayers:'Players added',player:'Player updated'})[action],at:new Date().toISOString()});s.activity=s.activity.slice(0,30);return s;
}

 <form id="settings-form" class="settings-grid"><section class="panel settings-card"><h2>Club identity</h2><label>Club name<input name="name" value="${e(s.name)}" maxlength="80" required></label><label>Season name<input name="season" value="${e(s.season)}" required></label><label>Wakefield logo<input type="file" id="logo-upload" accept="image/png,image/jpeg,image/webp"></label><small>PNG, JPEG or WebP · up to 500 KB. Your uploaded crest replaces the W monogram.</small><label>School pool rules<textarea name="rules" rows="4">${e(s.rules)}</textarea></label></section>
 <section class="panel settings-card"><h2>Competition defaults</h2><div class="form-pair"><label>Match length<select name="frames">${[1,3,5,7,9].map(n=>`<option value="${n}" ${n===s.frames?'selected':''}>Best of ${n}</option>`).join('')}</select></label><label>Cup final length<select name="finalFrames">${[1,3,5,7,9].map(n=>`<option value="${n}" ${n===s.finalFrames?'selected':''}>Best of ${n}</option>`).join('')}</select></label></div><div class="form-pair"><label>Points for a win<input type="number" name="winPoints" min="1" max="10" value="${s.winPoints}" required></label><label>Max division size<input type="number" name="divisionSize" min="3" max="20" value="${s.divisionSize}" required></label></div><label class="checkbox"><input type="checkbox" name="approval" ${s.approval?'checked':''}> Mr French approves submitted scores</label><label class="checkbox"><input type="checkbox" name="consolation" ${s.consolation?'checked':''}> First-round losers enter a consolation cup</label><div class="settings-note">League seasons have no end date. Start the next season once every fixture is complete. One player moves up and one moves down between neighbouring divisions.</div><button class="button primary" type="submit">Save club settings ✓</button></section></form>
 <section class="panel settings-card"><h2>${demo?'Connect your real club':'Your club is connected'}</h2><p>${demo?'This demo stays in this browser. Your real club uses Supabase so results are shared across devices. Follow README.md to connect Supabase and deploy on Netlify. No sample pupils are copied into your real club.':'Player PINs and administrator credentials are checked on the server. Only approved results affect standings when approval is enabled.'}</p>${demo?'<button class="button secondary" data-action="resetDemo">Reset demo data</button>':''}</section>`;}
function modal(title,body){$('#modal-root').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-heading"><div><span class="eyebrow">WAKEFIELD POOL CLUB</span><h2 id="modal-title">${title}</h2></div><button class="icon-button" data-action="close" aria-label="Close dialog">×</button></div>${body}</section></div>`;window.lastFocus=document.activeElement;setTimeout(()=>$('#modal-root input, #modal-root select, #modal-root button')?.focus(),0);}
function closeModal(){$('#modal-root').innerHTML='';window.lastFocus?.focus();}
function login(admin=false){modal(admin?'Administrator sign in':'Back at the table?',`<div class="tabs"><button data-action="playerLogin" class="${!admin?'selected':''}">Player</button><button data-action="adminLogin" class="${admin?'selected':''}">Mr French</button></div>${demo?`<p class="form-hint">Demo mode: use ${admin?'any password to explore admin controls':'PIN <b>1234</b> for any sample player'}. Real club access uses your own credentials.</p>`:''}<form id="login-form" data-role="${admin?'admin':'player'}">${admin?'<label>Administrator password<input name="password" type="password" autocomplete="current-password" required></label>':`<label>Your name<select name="id">${state.players.map(p=>`<option value="${p.id}">${e(p.name)}</option>`).join('')}</select></label><label>Your player PIN<input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4,6}" maxlength="6" autocomplete="current-password" required></label>`}<p id="login-error" class="error" role="alert"></p><button class="button primary full" type="submit">Sign in ↗</button></form><p class="form-hint">${admin?'Only Mr French can manage the club.':'Forgotten your PIN? Ask Mr French to reset it.'}</p>`);}
function record(id){if(!user){login();return;}const m=id?findMatch(state,id):null;if(m){if(!isAdmin()&&![m.a,m.b].includes(user.id)){toast('Choose one of your own matches to submit a result.');return;}if(state.submissions.some(s=>s.match===m.id)){toast('A result for this match is already awaiting approval.');return;}
 modal('How did it finish?',`<p class="form-hint">Best of ${m.bestOf} · ${state.settings.approval?'Mr French will check the result before it counts.':'This result will count immediately.'}</p><form id="score-form" data-match="${m.id}"><div class="score-entry"><label>${e(name(m.a))}<input name="a" type="number" min="0" max="${Math.ceil(m.bestOf/2)}" value="1" required></label><span>–</span><label>${e(name(m.b))}<input name="b" type="number" min="0" max="${Math.ceil(m.bestOf/2)}" value="0" required></label></div><button class="button primary full" type="submit">Submit result ✓</button></form>`);
 }else{const matches=openMatches().filter(m=>isAdmin()||[m.a,m.b].includes(user.id));modal('Choose your match',matches.length?`<form id="choose-match"><label>Available fixtures<select name="match">${matches.map(m=>`<option value="${m.id}">${e(name(m.a))} vs ${e(name(m.b))}</option>`).join('')}</select></label><button class="button primary full" type="submit">Enter result ↗</button></form>`:'<p>No unplayed fixtures are available for you right now.</p>');}}
function showPins(pins){modal('Private player PINs',`<p class="form-hint">${demo?'These are demo PINs only.':'New PINs replace previous ones. Give each player only their own PIN. Download now: these values cannot be retrieved later.'}</p><div class="pin-list">${pins.map(p=>`<div><span>${e(p.name)}</span><code>${e(p.pin)}</code></div>`).join('')}</div><button class="button primary full" id="download-pins">Download private PIN list ↓</button>`);$('#download-pins').onclick=()=>{const blob=new Blob(['Player,PIN\n'+pins.map(p=>`"${p.name.replaceAll('"','""')}",${p.pin}`).join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='wakefield-private-player-pins.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};}
const actions={
 close:closeModal,login:()=>login(),playerLogin:()=>login(),adminLogin:()=>login(true),record:()=>record(),refresh:()=>refresh().then(()=>toast('Club updated.')).catch(x=>toast(x.message)),
 demoAdmin:()=>{user={role:'admin',name:'Mr French'};render();toast('You’re exploring the demo as Mr French.');},
 logout:async()=>{if(!demo)await api('logout',{});user=null;page='overview';location.hash='overview';closeModal();render();},
 account:()=>modal('Your clubhouse',`<p>Signed in as <b>${e(user.name)}</b>.</p><button class="button secondary full" data-action="logout">Sign out</button>`),
 newCup:()=>modal('A new cup competition',`<p class="form-hint">All ${state.players.length} players enter a random draw. Byes are assigned automatically.</p><form id="cup-form"><label>Tournament name<input name="name" value="The Wakefield Cup" maxlength="70" required></label><button class="button primary full" type="submit">Make the draw ↗</button></form>`),
 generateLeague:()=>modal('Let the league begin',`<p>Players will be balanced across divisions of up to ${state.settings.divisionSize}. Set ability ratings in Players first, or leave everyone at zero for a random draw.</p><p>Every player faces everyone in their division once. There are no fixed match times.</p><button class="button primary full" data-action="confirmLeague">Generate fixtures ↗</button>`),
 confirmLeague:()=>mutate('league'),
 promote:()=>modal('A new season',`<p>Every current fixture must be completed first. The top player in each lower division moves up; the bottom player in the neighbouring division moves down. This season is saved in Past seasons.</p><button class="button primary full" data-action="confirmPromote">Archive and start next season ↗</button>`),confirmPromote:()=>mutate('promote'),
 addPlayers:()=>modal('More people. More good games.',`<p class="form-hint">Add players before drawing competitions. Use first names and surname initials. One unique display name per line, up to 64 players in total.</p><form id="players-form"><label>Player names<textarea name="names" rows="7" placeholder="Oliver W.&#10;Harry S.&#10;Jack B." required></textarea></label><button class="button primary full" type="submit">Add to the club ＋</button></form>`),
 pins:()=>modal('Generate player PINs?',`<p>This replaces all existing player PINs. Download the private list and share each PIN only with its owner.</p><button class="button primary full" data-action="confirmPins">Generate and show PINs</button>`),confirmPins:()=>mutate('pins'),
 resetDemo:()=>{if(confirm('Reset the sample club on this device?')){state=initialState(true);persist();render();toast('Demo reset.');}}
};
document.addEventListener('click',async event=>{const b=event.target.closest('button');if(!b)return;try{
 if(b.dataset.action)await actions[b.dataset.action]?.();
 else if(b.dataset.division){division=b.dataset.division;render();}
 else if(b.dataset.cup){cupIndex=+b.dataset.cup;render();}
 else if(b.dataset.score)record(b.dataset.score);
 else if(b.dataset.approve)await mutate('approve',{id:b.dataset.approve});
 else if(b.dataset.reject)await mutate('reject',{id:b.dataset.reject});
 else if(b.dataset.editPlayer){const p=state.players.find(p=>p.id===b.dataset.editPlayer);modal('Manage player',`<form id="player-form" data-id="${p.id}"><label>Display name<input name="name" maxlength="45" value="${e(p.name)}" required></label><label>Ability rating (0–100)<input type="number" name="rating" min="0" max="100" value="${p.rating}" required></label><p class="form-hint">Higher ratings are spread across divisions when generating the first league. Ratings do not affect points.</p><button class="button primary full" type="submit">Save player ✓</button></form><button class="button secondary full spaced" data-reset-pin="${p.id}">Reset this player’s PIN</button>`);}
 else if(b.dataset.resetPin)await mutate('pins',{id:b.dataset.resetPin});
 }catch(error){toast(error.message);}});
document.addEventListener('submit',async event=>{event.preventDefault();const f=event.target,data=Object.fromEntries(new FormData(f));const button=f.querySelector('[type="submit"]');if(button)button.disabled=true;
 try {
 if(f.getAttribute('id')==='login-form'){
  const role=f.dataset.role;
  if(demo){if(role==='player'&&data.pin!=='1234')throw Error('Use PIN 1234 in the demo.');user=role==='admin'?{role,name:'Mr French'}:{role,id:data.id,name:name(data.id)};}
  else {const r=await api('login',{...data,role});user=r.user;}
  closeModal();render();toast(`Welcome, ${user.name}.`);
 }else if(f.getAttribute('id')==='choose-match')record(data.match);
 else if(f.getAttribute('id')==='score-form')await mutate('submit',{id:f.dataset.match,score:[+data.a,+data.b]});
 else if(f.getAttribute('id')==='cup-form'){cupIndex=state.cups.length;await mutate('cup',data);}
 else if(f.getAttribute('id')==='players-form')await mutate('addPlayers',data);
 else if(f.getAttribute('id')==='player-form')await mutate('player',{...data,id:f.dataset.id});
 else if(f.getAttribute('id')==='settings-form'){
   data.approval=f.approval.checked;data.consolation=f.consolation.checked;
   const file=$('#logo-upload').files[0];if(file){if(file.size>500000)throw Error('Please choose a logo under 500 KB.');if(!['image/png','image/jpeg','image/webp'].includes(file.type))throw Error('Choose a PNG, JPEG or WebP image.');data.logo=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file);});}
   await mutate('settings',data);
 }
 }catch(error){const el=$('#login-error');if(el)el.textContent=error.message;else toast(error.message);}finally{if(button)button.disabled=false;}
});
document.addEventListener('input',event=>{if(event.target.id==='fixture-search'){filter=event.target.value;const fixtures=state.league.filter(m=>m.division===division&&[name(m.a),name(m.b)].some(n=>n.toLowerCase().includes(filter.toLowerCase())));$('#fixture-list').innerHTML=fixtures.length?fixtures.map(matchRow).join(''):empty('No matches found','Try another player name.');}});
document.addEventListener('keydown',event=>{const modalEl=$('.modal');if(!modalEl)return;if(event.key==='Escape')closeModal();if(event.key==='Tab'){const fields=[...modalEl.querySelectorAll('button:not(:disabled),input,select,textarea,a[href]')];const first=fields[0],last=fields.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}});
window.addEventListener('hashchange',()=>{const next=location.hash.slice(1);page=['overview','league','cup','players','approvals','settings'].includes(next)?next:'overview';filter='';render();window.scrollTo({top:0,behavior:'smooth'});});
async function boot(){try{const config=await api('config');demo=!config.configured;if(!demo){await refresh();}else{state=stored()||initialState(true);persist();}}catch{ $('#app').innerHTML='<div class="loading">The club could not connect.<span>Check your connection and reload. Your data has not been changed.</span></div>';return;}page=['league','cup','players','approvals','settings'].includes(location.hash.slice(1))?location.hash.slice(1):'overview';render();}
state=stored()||initialState(true);persist();render();</script></body>
</html>
