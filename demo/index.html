:root{
  --ink:#242a27;
  --muted:#62675f;
  --gold:#f1cc53;
  --paper:#faf8f2;
  --line:#e6e9e1;
  --green:#305b45;
  --sidebar:232px;
  font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,'DejaVu Sans',sans-serif;
  color:var(--ink);
  background:var(--paper);
  font-synthesis:none;
  font-size:14px
}
*{
  box-sizing:border-box
}
body{
  margin:0
}
button,input,select,textarea{
  font:inherit
}
button,a,input,select,textarea{
  -webkit-tap-highlight-color:transparent
}
button,a{
  touch-action:manipulation
}
button{
  cursor:pointer;
  color:inherit;
  border:0;
  background:none
}
button:disabled{
  cursor:default;
  opacity:.55
}
a{
  color:inherit;
  text-decoration:none
}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{
  outline:3px solid #bda13d;
  outline-offset:4px
}
h1,h2,h3,p{
  margin:0
}
svg.icon{
  display:inline-block;
  flex-shrink:0;
  vertical-align:middle
}
img{
  max-width:100%
}
[hidden]{
  display:none!important
}
.sr-only{
  position:absolute;
  width:1px;
  height:1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap
}
.skip-link{
  position:fixed;
  top:-100px;
  left:250px;
  background:var(--gold);
  padding:12px;
  z-index:300
}
.skip-link:focus{
  top:12px
}
.sidebar{
  position:fixed;
  width:var(--sidebar);
  height:100dvh;
  inset:0 auto 0 0;
  background:#252723;
  color:#626b59;
  display:flex;
  flex-direction:column;
  padding:32px 18px 0;
  z-index:30
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  margin:0 13px 47px;
  color:#f7f6e9
}
.brand img{
  width:36px;
  height:44px;
  object-fit:contain
}
.brand>span{
  font-family:Georgia,serif;
  font-weight:bold;
  font-size:17px;
  letter-spacing:1.5px
}
.brand small{
  display:block;
  font-family:Arial,sans-serif;
  font-size:12px;
  letter-spacing:3px;
  color:#c3cab8;
  font-weight:400;
  margin-top:6px
}
.sidebar-label{
  font-size:12px;
  letter-spacing:1.7px;
  font-weight:600;
  color:#7f9082;
  margin:0 16px 14px
}
.nav-link{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 16px;
  font-size:12px;
  border-radius:7px;
  margin-bottom:6px;
  color:#626b59;
  position:relative;
  transition:background .15s,color .15s
}
.nav-link .icon{
  color:#626b59
}
.nav-link:hover{
  background:#2b3a2f;
  color:#fff
}
.nav-link.active{
  background:var(--gold);
  color:#30372b;
  font-weight:650
}
.nav-link.active .icon{
  color:#3d4431
}
.nav-link b{
  margin-left:auto;
  background:#e2b92c;
  color:#2f3929;
  border-radius:4px;
  padding:2px 6px;
  font-size:12px
}
.admin-label{
  margin-top:34px
}
.sidebar-bottom{
  margin-top:auto
}
.sidebar-season{
  margin:25px 13px 27px;
  padding:22px 0 15px;
  border-top:1px solid #40503f;
  position:relative;
  overflow:hidden
}
.sidebar-season>span{
  font-size:12px;
  font-weight:650;
  letter-spacing:1px;
  position:relative;
  z-index:1
}
.status-dot{
  width:6px;
  height:6px;
  display:inline-block;
  flex-shrink:0;
  border-radius:50%;
  background:#739c6c;
  vertical-align:middle;
  margin-right:6px
}
.sidebar-season .status-dot{
  background:#bbcb79;
  width:5px;
  height:5px
}
.sidebar-season p{
  font-size:17px;
  font-weight:450;
  line-height:1.5;
  color:#d5ddcd;
  margin-top:17px;
  letter-spacing:-.3px;
  position:relative;
  z-index:1
}
.sidebar-ball{
  position:absolute;
  right:-28px;
  bottom:-28px;
  width:130px;
  height:130px;
  border:1px solid #657a5740;
  border-radius:50%;
  font-size:90px;
  font-weight:650;
  color:#657a572b;
  text-align:center
}
.account{
  width:100%;
  display:flex;
  text-align:left;
  align-items:center;
  gap:10px;
  padding:21px 5px;
  border-top:1px solid #3b4a3c
}
.account>.avatar{
  background:#d8dfc5;
  color:#4c5d44;
  width:32px;
  height:32px
}
.account>span:nth-child(2){
  flex:1;
  color:#e0e7d6;
  font-size:12px;
  font-weight:550
}
.account small{
  display:block;
  font-weight:400;
  color:#626b59;
  font-size:12px;
  margin-top:6px
}
.account>.icon{
  color:#626b59
}
main{
  margin-left:var(--sidebar);
  min-height:100dvh
}
.topbar{
  height:76px;
  padding:0 38px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--line);
  background:#fcfcf9
}
.breadcrumb{
  display:flex;
  align-items:center;
  gap:14px;
  color:#626b59;
  font-size:12px
}
.breadcrumb strong{
  color:#525d4e;
  font-size:12px;
  font-weight:500
}
.breadcrumb .icon{
  color:#626b59
}
.topbar-actions{
  display:flex;
  align-items:center;
  gap:15px
}
.badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  white-space:nowrap;
  font-size:12px;
  font-weight:550;
  border-radius:20px;
  padding:6px 9px;
  background:#f5f0db;
  color:#626b59;
  line-height:1
}
.badge i{
  width:4px;
  height:4px;
  border-radius:50%;
  background:currentColor
}
.badge.neutral{
  background:#f0f2eb;
  color:#7d8771
}
.badge.green{
  background:#eaf2e7;
  color:#597b4d
}
.badge.amber{
  background:#fff3cb;
  color:#626b59
}
.icon-button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:36px;
  height:36px;
  border-radius:7px;
  color:#7c8970
}
.icon-button:hover{
  background:#edf0e6
}
.button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  min-height:40px;
  padding:11px 16px;
  border-radius:7px;
  font-size:12px;
  font-weight:550;
  line-height:1.4;
  transition:background .15s,transform .15s;
  white-space:nowrap
}
.button:active{
  transform:translateY(1px)
}
.button.primary{
  background:#273c2d;
  color:#fff
}
.button.primary:hover{
  background:#3c5740
}
.button.secondary{
  background:#fff;
  border:1px solid #dfe5d6;
  color:#657455
}
.button.secondary:hover{
  background:#f1f5ea
}
.button.gold{
  background:var(--gold);
  color:#354029
}
.button.gold:hover{
  background:#ffe181
}
.full{
  width:100%
}
.spaced{
  margin-top:14px
}
.share-button{
  min-height:34px;
  padding:8px 13px;
  font-size:12px;
  gap:7px
}
.mobile-brand,.mobile-account,.mobile-nav{
  display:none
}
.demo-strip{
  padding:10px 38px;
  background:#f6f0dc;
  border-bottom:1px solid #e9e2c9;
  font-size:12px;
  color:#626b59;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px
}
.demo-strip>span{
  display:flex;
  align-items:center;
  gap:8px;
  line-height:1.7
}
.demo-strip b{
  font-weight:600;
  color:#7e724c
}
.demo-strip button{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
  color:#7b6d3d
}
.content{
  max-width:1500px;
  margin:auto;
  padding:35px 38px 38px
}
.content:focus{
  outline:none
}
.page-heading{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  margin-bottom:27px
}
.eyebrow{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:12px;
  font-weight:650;
  letter-spacing:1.6px;
  color:#626b59;
  margin-bottom:11px
}
.eyebrow>span{
  width:15px;
  height:2px;
  background:#b9ab62
}
.page-heading h1{
  font-size:31px;
  font-weight:550;
  letter-spacing:-1.25px;
  line-height:1.2;
  color:#2d362c
}
.page-heading p{
  font-size:12px;
  color:#626b59;
  margin-top:10px;
  line-height:1.8
}
.heading-actions{
  flex-shrink:0
}
.hero{
  border-radius:12px;
  overflow:hidden;
  background:#2c3029;
  color:#fff;
  display:grid;
  grid-template-columns:1.1fr 1fr;
  min-height:319px;
  position:relative;
  border:1px solid #2c3029
}
.hero-copy{
  padding:32px 34px 28px;
  z-index:1
}
.hero-label{
  font-size:12px;
  letter-spacing:1.1px;
  color:#d3dec3;
  display:inline-flex;
  align-items:center;
  gap:5px;
  background:#ffffff0a;
  border:1px solid #b3c69a30;
  border-radius:20px;
  padding:7px 10px
}
.hero-label .status-dot{
  background:var(--gold);
  width:4px;
  height:4px;
  margin:0 3px 0 0
}
.hero h2{
  font-size:40px;
  line-height:1.12;
  letter-spacing:-1.8px;
  font-weight:500;
  margin-top:19px;
  color:#f7f8ea
}
.hero-copy>p{
  font-size:12px;
  line-height:1.9;
  color:#626b59;
  margin:14px 0 20px
}
.hero-actions{
  display:flex;
  align-items:center;
  gap:22px
}
.hero-actions .button{
  font-size:12px;
  min-height:38px;
  padding:10px 14px;
  gap:15px
}
.hero-format{
  font-size:12px;
  color:#d3ddbf;
  line-height:1.9;
  white-space:nowrap
}
.hero-format .icon{
  margin-right:4px
}
.hero-format>span{
  display:block;
  color:#626b59;
  font-size:12px;
  margin-left:24px
}
.hero-foot{
  display:flex;
  align-items:center;
  gap:11px;
  font-size:12px;
  color:#626b59;
  margin-top:23px
}
.hero-foot b{
  font-weight:500;
  color:#dee7d0
}
.mini-avatars{
  display:flex;
  padding-left:6px
}
.mini-avatars i{
  border-radius:50%;
  width:22px;
  height:22px;
  font-size:12px;
  font-style:normal;
  display:grid;
  place-items:center;
  background:#c9d5b5;
  border:2px solid #264332;
  color:#536640;
  margin-left:-6px
}
.mini-avatars i:nth-child(2){
  background:#e1d6aa
}
.mini-avatars i:nth-child(3){
  background:#aec4b7
}
.mini-avatars i:nth-child(4){
  background:#b9bb9e
}
.hero-art{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  min-width:0;
  background:radial-gradient(ellipse at 60% 50%,#65845450,transparent 70%)
}
.pool-art{
  width:112%;
  max-width:540px;
  position:absolute;
  right:0;
  top:50%;
  transform:translateY(-50%);
  pointer-events:none
}
.art-caption{
  position:absolute;
  right:28px;
  bottom:24px;
  display:flex;
  align-items:center;
  gap:9px;
  font-size:12px;
  letter-spacing:1.3px;
  color:#626b59
}
.art-caption i{
  width:12px;
  height:1px;
  background:#a1aa6b
}
.stats-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin:22px 0 26px
}
.stat{
  border:1px solid var(--line);
  border-radius:9px;
  background:#fff;
  padding:19px 20px 18px
}
.stat>div:first-child{
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:#626b59;
  font-size:12px;
  gap:5px
}
.stat>div:first-child .icon{
  color:#626b59;
  width:17px;
  height:17px
}
.stat strong{
  display:flex;
  align-items:baseline;
  gap:9px;
  font-weight:500;
  font-size:33px;
  line-height:1.2;
  letter-spacing:-1.3px;
  margin-top:12px;
  color:#38452f
}
.stat strong small{
  font-size:12px;
  font-weight:400;
  color:#626b59;
  letter-spacing:0
}
.stat p{
  font-size:12px;
  color:#626b59;
  margin-top:11px;
  line-height:1.7
}
.stat p .status-dot{
  height:4px;
  width:4px
}
.accent-stat{
  background:#f0f3e9;
  border-color:#e0e6d4
}
.stat-progress{
  display:flex;
  align-items:center;
  gap:9px;
  margin-top:13px;
  color:#626b59;
  font-size:12px
}
progress{
  appearance:none;
  -webkit-appearance:none;
  border:0;
  border-radius:6px;
  width:100%;
  height:5px;
  overflow:hidden;
  background:#edf0e6
}
progress::-webkit-progress-bar{
  background:#edf0e6
}
progress::-webkit-progress-value{
  background:#cfb755;
  border-radius:5px
}
progress::-moz-progress-bar{
  background:#cfb755;
  border-radius:5px
}
.dashboard-grid{
  display:grid;
  grid-template-columns:1.17fr 1fr;
  gap:22px
}
.panel{
  border:1px solid var(--line);
  background:#fff;
  border-radius:9px;
  overflow:hidden;
  min-width:0
}
.panel-heading{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:23px 23px 18px
}
.section-kicker{
  font-size:12px;
  letter-spacing:1.3px;
  color:#626b59;
  font-weight:600;
  display:block;
  margin-bottom:9px
}
.panel h2{
  font-size:15px;
  font-weight:550;
  letter-spacing:-.35px;
  line-height:1.4
}
.panel-heading p{
  font-size:12px;
  color:#626b59;
  margin-top:7px;
  line-height:1.8
}
.panel-description{
  padding:0 23px 18px;
  font-size:12px;
  color:#626b59;
  line-height:1.8
}
.text-link{
  display:inline-flex;
  align-items:center;
  gap:7px;
  font-size:12px;
  font-weight:550;
  color:#7b8968;
  white-space:nowrap
}
.text-link:hover{
  color:#344e2e;
  text-decoration:underline;
  text-underline-offset:4px
}
.match-row{
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px 16px;
  padding:17px 23px;
  border-top:1px solid #edf0e7;
  align-items:center
}
.match-meta{
  grid-column:1;
  display:flex;
  align-items:center;
  gap:9px;
  font-size:12px;
  color:#626b59;
  line-height:1.4
}
.match-meta>span{
  background:#f8f6ed;
  padding:3px 6px;
  border-radius:3px;
  font-weight:550
}
.match-meta small{
  font-size:12px;
  color:#626b59
}
.match-pair{
  grid-column:1;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px
}
.person{
  display:inline-flex;
  align-items:center;
  gap:10px;
  font-size:12px;
  font-weight:500;
  white-space:nowrap;
  color:#57634c;
  min-width:0
}
.person>span:last-child{
  overflow:hidden;
  text-overflow:ellipsis
}
.person small{
  display:block;
  font-size:12px;
  color:#626b59;
  margin-top:3px;
  font-weight:400
}
.avatar{
  width:32px;
  height:32px;
  border-radius:50%;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  font-size:12px;
  font-weight:550;
  background:#e9eddf;
  color:#7a8864
}
.avatar.a1{
  background:#f4edce;
  color:#626b59
}
.avatar.a2{
  background:#e4eee7;
  color:#648574
}
.avatar.a3{
  background:#eee6dc;
  color:#626b59
}
.avatar.a4{
  background:#e8e8f2;
  color:#626b59
}
.avatar.a5{
  background:#f2e4de;
  color:#626b59
}
.person.small{
  font-size:12px;
  gap:8px
}
.person.small .avatar{
  width:28px;
  height:28px;
  font-size:12px
}
.vs{
  font-size:12px;
  color:#626b59;
  flex-shrink:0
}
.match-score{
  font-size:14px;
  color:#64734f;
  font-weight:600
}
.match-score i{
  font-size:12px;
  font-style:normal;
  color:#626b59;
  margin:0 3px
}
.round-button{
  grid-column:2;
  grid-row:1/3;
  width:30px;
  height:30px;
  background:#f5f7ee;
  border:1px solid #e7eddb;
  border-radius:7px;
  color:#626b59;
  display:grid;
  place-items:center
}
.round-button:hover{
  background:#f4e8ac;
  color:#5d602b;
  border-color:#d8ca83
}
.match-row>.badge{
  grid-column:2;
  grid-row:1/3;
  font-size:12px;
  padding:5px 7px
}
.panel-foot{
  display:flex;
  gap:7px;
  align-items:center;
  background:#fcfdf9;
  color:#626b59;
  font-size:12px;
  padding:13px 23px;
  border-top:1px solid #edf0e7;
  line-height:1.7
}
.tabs{
  display:flex;
  align-items:center;
  gap:3px;
  padding:4px;
  border-radius:7px;
  background:#f0f2e9;
  width:max-content;
  max-width:100%;
  overflow-x:auto
}
.tabs button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  font-size:12px;
  color:#626b59;
  padding:9px 12px;
  border-radius:5px;
  white-space:nowrap;
  min-height:32px
}
.tabs button.selected{
  color:#536442;
  background:#fff;
  box-shadow:0 1px 4px #25351712;
  font-weight:550
}
.tabs.compact{
  margin:0 23px 16px
}
.tabs.compact button{
  font-size:12px;
  padding:7px 11px;
  min-height:27px
}
.table-scroll{
  overflow-x:auto
}
table{
  width:100%;
  border-collapse:collapse;
  text-align:left
}
th{
  font-size:12px;
  letter-spacing:.2px;
  color:#626b59;
  background:#fafbf6;
  font-weight:500;
  padding:12px;
  border-block:1px solid #edf1e5
}
th abbr{
  text-decoration:none;
  cursor:help
}
td{
  font-size:12px;
  color:#626b59;
  padding:13px 12px;
  border-bottom:1px solid #f0f2e9
}
th:first-child,td:first-child{
  padding-left:23px;
  width:43px
}
th:last-child,td:last-child{
  padding-right:23px;
  text-align:right
}
td strong{
  font-size:12px;
  font-weight:600;
  color:#607347
}
.rank{

async function mutate(action,payload={}){
  if(busy)return;busy=true;
  try {
    let pins;
    if(demo){const next=structuredClone(state);if(action==='pins'){if(!isAdmin())throw Error('Administrator access required.');pins=next.players.filter(p=>!payload.id||p.id===payload.id).map(p=>({name:p.name,pin:'1234'}));}else act(next,action,payload,user);state=next;persist();}

}

  if(demo){if(role==='player'&&data.pin!=='1234')throw Error('Use PIN 1234 in the demo.');user=role==='admin'?{role,name:'Mr French'}:{role,id:data.id,name:name(data.id)};}
  else {const r=await api('login',{...data,role});user=r.user;}
  if(user.id){division=state.divisions.find(d=>d.players.includes(user.id))?.id||division;}closeModal();render();toast(`Welcome, ${user.name}.`);if(intendedMatch){const next=intendedMatch;intendedMatch=null;record(next===true?undefined:next);}
 }else if(f.getAttribute('id')==='choose-match')record(data.match);
 else if(f.getAttribute('id')==='score-form'){const score=data.winner?(data.winner==='a'?[1,0]:[0,1]):[+data.a,+data.b];await mutate('submit',{id:f.dataset.match,score});}
 else if(f.getAttribute('id')==='cup-form'){cupIndex=state.cups.length;await mutate('cup',data);}
 else if(f.getAttribute('id')==='players-form')await mutate('addPlayers',data);
 else if(f.getAttribute('id')==='player-form')await mutate('player',{...data,id:f.dataset.id});
 else if(f.getAttribute('id')==='settings-form'){
   data.approval=f.approval.checked;data.consolation=f.consolation.checked;
   const file=$('#logo-upload').files[0];if(file){if(file.size>500000)throw Error('Please choose a logo under 500 KB.');if(!['image/png','image/jpeg','image/webp'].includes(file.type))throw Error('Choose a PNG, JPEG or WebP image.');data.logo=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file);});}
   await mutate('settings',data);
 }
 }catch(error){const el=$('#login-error')||$('#score-error');if(el)el.textContent=error.message;else toast(error.message);}finally{if(button)button.disabled=false;}
});
document.addEventListener('click',event=>{if(event.target.closest('[data-go-fixtures]')){leagueView='fixtures';fixtureStatus='available';filter='';myMatches=!!user?.id;fixtureLimit=20;if(location.hash==='#league')render();}if(event.target.closest('[data-go-standings]')){leagueView='standings';if(location.hash==='#league')render();}if(event.target.closest('[data-close-on-nav]'))closeModal();});
document.addEventListener('input',event=>{
 if(event.target.id==='fixture-search'){filter=event.target.value;fixtureLimit=20;$('#fixture-list').innerHTML=fixtureList();}
 if(event.target.id==='player-search'){playerFilter=event.target.value;let count=0;document.querySelectorAll('[data-player-name]').forEach(card=>{card.hidden=!card.dataset.playerName.includes(playerFilter.toLowerCase());if(!card.hidden)count++;});$('.player-count').textContent=`${count} players`;$('#player-empty').hidden=count>0;}
});
document.addEventListener('change',event=>{
 if(event.target.id==='my-matches'){myMatches=event.target.checked;fixtureLimit=20;$('#fixture-list').innerHTML=fixtureList();}
 if(event.target.id==='round-jump'){const round=$(`#bracket-round-${event.target.value}`);const bracket=$('.bracket');bracket.scrollTo({left:round.getBoundingClientRect().left-bracket.getBoundingClientRect().left+bracket.scrollLeft-20,behavior:'instant'});}
});
document.addEventListener('keydown',event=>{const modalEl=$('.modal');if(!modalEl)return;if(event.key==='Escape')closeModal();if(event.key==='Tab'){const fields=[...modalEl.querySelectorAll('button:not(:disabled),input,select,textarea,a[href]')];const first=fields[0],last=fields.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}});
window.addEventListener('hashchange',()=>{if(!state||location.hash==='#main-content')return;const next=location.hash.slice(1);page=['overview','league','cup','players','approvals','settings'].includes(next)?next:'overview';filter='';fixtureLimit=20;render();window.scrollTo({top:0,behavior:'smooth'});});
async function boot(){try{const config=await api('config');demo=!config.configured;if(!demo){await refresh();}else{state=stored()||initialState(true);persist();}}catch{ $('#app').innerHTML='<div class="loading">The club could not connect.<span>Check your connection and reload. Your data has not been changed.</span><button class="button primary" data-action="retry">Try again</button></div>';return;}page=['league','cup','players','approvals','settings'].includes(location.hash.slice(1))?location.hash.slice(1):'overview';render();}
state=stored()||initialState(true);persist();render();</script></body>
